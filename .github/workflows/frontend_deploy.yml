name: Frontend Deploy and Test


on:
  push:
    branches:
      - frontend  # Rama que dispara el pipeline de CI/CD

jobs:
  # Job para pruebas del frontend
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16.x'  # O la versión de Node.js que estés usando

    - name: Install dependencies
      run: |
        npm install
      working-directory: ./react-app  # Directorio de tu proyecto React

    - name: Run frontend tests
      run: |
        npm test -- --watchAll=false
      working-directory: ./react-app

  # Job para despliegue del frontend
  deploy:
    runs-on: ubuntu-latest
    needs: test  # Este paso asegura que 'deploy' solo se ejecuta si 'test' pasa correctamente

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16.x'

    - name: Copy project to EC2 and restart server
      env:
        EC2_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_IP: ${{ secrets.FRONTEND_SSH_HOST }}
        EC2_USER: ${{ secrets.FRONTEND_USER_NAME }}
        APP_DIR: /home/ubuntu/Parcial-Arquitectura-AWS-Big-Data  # Directorio en la instancia EC2
      run: |
        echo "$EC2_PRIVATE_KEY" | tr -d '\r' > ec2_key
        chmod 600 ec2_key
        ssh -o StrictHostKeyChecking=no -i ec2_key ${EC2_USER}@${SERVER_IP} '
            # Asegurarse de que Apache esté instalado
            sudo apt update
            sudo apt install -y apache2
            
            # Acceder al directorio del proyecto en EC2
            cd ${APP_DIR}/react-app &&
            
            # Sincronizar el repositorio con la última versión
            git fetch --all &&
            git reset --hard origin/frontend &&
            git pull origin frontend &&
            
            # Instalar dependencias y construir el proyecto
            npm install &&
            npm run build &&
            
            # Copiar el build a la carpeta de Apache y reiniciar el servidor
            sudo cp -r build/* /var/www/html/ &&
            sudo systemctl restart apache2
        '
