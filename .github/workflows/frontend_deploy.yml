name: Frontend Deploy and Test

on:
  push:
    branches:
      - frontend  # Rama en la que quieres que se ejecuten las pruebas y el despliegue

jobs:
  # Job para ejecutar las pruebas de React
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.x'  # Asegúrate de que coincida con tu versión de Node.js

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          cd react-app
          npm install

      # Step 4: Run frontend tests
      - name: Run frontend tests
        run: |
          cd react-app
          

      # Step 5: Report test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: react-app/coverage/

  # Job para desplegar el frontend
  deploy:
    runs-on: ubuntu-latest
    needs: test  # Asegura que el despliegue se ejecute solo si el job 'test' pasa

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.x'

      # Step 3: Copy project to EC2 and restart server
      - name: Copy project to EC2 and restart server
        env:
          EC2_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.FRONTEND_SSH_HOST }}
          EC2_USER: ${{ secrets.FRONTEND_USER_NAME }}
          APP_DIR: /home/ubuntu/Parcial-Arquitectura-AWS-Big-Data  # Ubicación en la instancia EC2
        run: |
          echo "$EC2_PRIVATE_KEY" | tr -d '\r' > ec2_key
          chmod 600 ec2_key
          ssh -o StrictHostKeyChecking=no -i ec2_key ${EC2_USER}@${SERVER_IP} '
              # Instalar Apache si no está instalado
              sudo apt-get update &&
              sudo apt-get install -y apache2 &&
              
              # Acceder al directorio del proyecto
              cd ${APP_DIR}/react-app &&

              # Sincronizar los últimos cambios del repositorio
              git fetch --all &&
              git reset --hard origin/frontend &&
              git pull origin frontend &&

              # Instalar dependencias y construir el proyecto
              npm install &&
              npm run build &&

              # Copiar la construcción al directorio de Apache y reiniciar Apache
              sudo cp -r build/* /var/www/html/ &&
              sudo systemctl restart apache2
          '
