name: Backend Deploy

on:
  push:
    branches:
      - backend

jobs:
  # Job para ejecutar pruebas unitarias
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        python -m unittest test_main_app.py  # Cambia 'tests' al directorio donde estén tus pruebas unitarias

  # Job para crear los recursos en AWS S3 y ejecutar scripts de jobs en Glue
  aws_setup:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install boto3
      run: |
        pip install boto3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: 'us-east-1'  # Cambia a tu región de AWS

    - name: Upload jobs to S3
      run: |
        python scripts/upload_jobs_to_s3.py  # Script para subir archivos de jobs a S3

    - name: Run AWS Glue job
      run: |
        python scripts/run_glue_job.py  # Script para ejecutar el job de Glue

  # Job para desplegar en EC2
  deploy:
    runs-on: ubuntu-latest
    needs: [test, aws_setup]

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup SSH and deploy to EC2
      env:
        EC2_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_IP: ${{ secrets.BACKEND_SSH_HOST }}
        EC2_USER: ${{ secrets.BACKEND_USER_NAME }}
        APP_DIR: /home/ubuntu/Parcial-Arquitectura-AWS-Big-Data  # Cambia a la ubicación del proyecto en la instancia EC2
      run: |
        echo "$EC2_PRIVATE_KEY" | tr -d '\r' > ec2_key
        chmod 600 ec2_key
        ssh -o StrictHostKeyChecking=no -i ec2_key ${EC2_USER}@${SERVER_IP} '
            cd ${APP_DIR} &&
            git fetch --all &&
            git reset --hard origin/backend &&
            git pull origin backend &&
            pip install -r requirements.txt &&
            pkill gunicorn || true &&
            gunicorn -b 0.0.0.0:5000 main_app:app --daemon
        '
